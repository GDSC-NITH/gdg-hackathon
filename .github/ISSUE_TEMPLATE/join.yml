name: Request listing
description: Request a listing in the Homecraft public directory.
title: "Request listing: "
labels: [join]
body:
  - type: markdown
    attributes:
      value: |
        Submitted information is public. Keep a working portal connected to the shared directory. Existing websites can install the portal plugin: https://github.com/terryHu7/homecraft/tree/main/plugin
  - type: input
    id: url
    attributes:
      label: Address
      description: A public HTTPS URL.
      placeholder: https://alex.github.io/home/
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Website name
      description: Up to 60 characters.
      placeholder: Alex's Home
    validations:
      required: true
  - type: input
    id: name_en
    attributes:
      label: English name (optional)
      description: Fill in only if different from the name above.
  - type: input
    id: owner
    attributes:
      label: Author name
      description: Up to 40 characters.
      placeholder: Alex
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: Languages
      options:
        - English
        - Chinese and English
        - Chinese
    validations:
      required: true
  - type: input
    id: intro
    attributes:
      label: Introduction
      description: Up to 120 characters. Leave blank only if homecraft.json provides intro.
  - type: input
    id: intro_en
    attributes:
      label: English introduction (optional)
  - type: input
    id: logo
    attributes:
      label: Logo
      description: A square image on the same website, up to 100 KB. Leave blank only if homecraft.json provides logo.
      placeholder: https://alex.github.io/home/assets/logo.png
  - type: input
    id: preview
    attributes:
      label: Preview image (optional)
      description: An image on the same website, such as og.jpg.
      placeholder: https://alex.github.io/home/assets/og.jpg
