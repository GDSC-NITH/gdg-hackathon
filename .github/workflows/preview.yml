name: Vercel Preview Deployment
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  deployments: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Vercel Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Vercel Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Vercel credentials are not configured in repository secrets."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Preview to Vercel
        id: deploy
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          DEPLOY_OUTPUT=""
          DEPLOY_STATUS=0
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --meta prId=${{ github.event.pull_request.number }} --meta prRef="${{ github.event.pull_request.head.ref }}" 2>&1) || DEPLOY_STATUS=$?
          
          if [ $DEPLOY_STATUS -eq 0 ]; then
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n 1 || echo "$DEPLOY_OUTPUT" | tail -n 1)
            echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
            echo "rate_limited=false" >> $GITHUB_OUTPUT
            echo "Deployed successfully to: $DEPLOY_URL"
          elif echo "$DEPLOY_OUTPUT" | grep -qiE "api-deployments-free-per-day|Resource is limited|rate limit"; then
            echo "::warning::Vercel preview deployment daily rate limit reached (100/day on free tier). Skipping preview deployment."
            echo "url=" >> $GITHUB_OUTPUT
            echo "rate_limited=true" >> $GITHUB_OUTPUT
          else
            echo "$DEPLOY_OUTPUT"
            exit $DEPLOY_STATUS
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Assign Stable Alias to Pull Request
        id: alias
        if: steps.check-secrets.outputs.has_secrets == 'true' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL.trim();
            const token = process.env.VERCEL_TOKEN;
            const teamId = process.env.VERCEL_ORG_ID;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const prNumber = process.env.PR_NUMBER;

            const host = deployUrl.replace(/^https?:\/\//, '').split('/')[0];
            console.log(`Original deployment host: ${host}`);

            // Fetch team slug to build the stable scoped alias
            let teamSlug = 'devprashant19s-projects';
            try {
              const teamRes = await fetch(`https://api.vercel.com/v2/teams/${teamId}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (teamRes.ok) {
                const tdata = await teamRes.json();
                if (tdata.slug) teamSlug = tdata.slug;
              }
            } catch (e) {
              console.warn('Could not fetch team slug:', e.message);
            }

            const candidates = [
              `gdg-hackathon-pr-${prNumber}-${teamSlug}.vercel.app`,
              `gdg-hackathon-pr-${prNumber}.vercel.app`
            ];

            let activeAlias = null;
            for (const alias of candidates) {
              console.log(`Attempting to set alias: ${alias}`);
              try {
                const res = await fetch(`https://api.vercel.com/v2/deployments/${host}/aliases?teamId=${teamId}`, {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ alias }),
                });
                const data = await res.json();
                if (res.ok) {
                  console.log(`Successfully mapped stable alias to ${alias}`);
                  activeAlias = alias;
                  break;
                } else {
                  console.warn(`Could not set alias ${alias}:`, JSON.stringify(data));
                }
              } catch (e) {
                console.warn(`Fetch error for alias ${alias}:`, e.message);
              }
            }

            const finalUrl = activeAlias ? `https://${activeAlias}` : (deployUrl.startsWith('http') ? deployUrl : `https://${deployUrl}`);
            core.setOutput('final_url', finalUrl);
            core.setOutput('alias', activeAlias || '');

      - name: Comment on Pull Request
        if: steps.check-secrets.outputs.has_secrets == 'true' && steps.alias.outputs.final_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const finalUrl = '${{ steps.alias.outputs.final_url }}';
            const marker = '<!-- vercel-preview-deployment -->';

            const commentBody = `${marker}
            ### 🚀 Vercel Preview Deployment Ready!

            | Name | Status | Preview Link |
            | :--- | :--- | :--- |
            | **Labyrinth 3D Site** | ✅ Deployed | [**${finalUrl}**](${finalUrl}) |

            * **Commit**: \`${context.payload.pull_request.head.sha.substring(0, 7)}\`
            * **Triggered by**: @${context.actor}
            * **Branch**: \`${context.payload.pull_request.head.ref}\`
            * **Stable Link**: This preview link stays the same for every commit in this PR and is automatically decommissioned when merged.

            > *All 3D voxel stations, GLB models, and interactive cards are built and live in this preview.*`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const botComment = comments.find(comment => comment.body.includes(marker));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
              }
            } catch (err) {
              console.warn('Could not post PR preview comment:', err.message);
            }

      - name: Comment on Pull Request (Rate Limited)
        if: steps.check-secrets.outputs.has_secrets == 'true' && steps.deploy.outputs.rate_limited == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const marker = '<!-- vercel-preview-rate-limited -->';
            const commentBody = `${marker}
            ### ⚠️ Vercel Preview Deployment Deferred

            Vercel daily deployment quota (100 deployments/24h on free tier) has been reached for this account.
            * **Status**: Preview deployment skipped for commit \`${context.payload.pull_request.head.sha.substring(0, 7)}\`
            * **CI Status**: All code tests and checks continue to run normally.
            * The quota automatically resets as the 24-hour rolling window advances.`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              const botComment = comments.find(c => c.body.includes(marker));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody,
                });
              }
            } catch (err) {
              console.warn('Could not post rate limit comment:', err.message);
            }

  cleanup-preview:
    name: Kill Vercel Preview on Merge/Close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Vercel Credentials
        id: check-secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Vercel credentials are not configured in repository secrets."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Tear Down Deployments and Remove Alias
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const token = process.env.VERCEL_TOKEN;
            const teamId = process.env.VERCEL_ORG_ID;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const prNumber = String(process.env.PR_NUMBER);
            const branchRef = process.env.BRANCH_REF;

            console.log(`Cleaning up Vercel preview resources for PR #${prNumber} (branch: ${branchRef})...`);

            // 1. Delete matching aliases
            try {
              const aliasRes = await fetch(`https://api.vercel.com/v4/aliases?teamId=${teamId}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const aliasData = await aliasRes.json();
              // Only this PR's own aliases: "pr-4" must not match "pr-41".
              const ownAlias = new RegExp(`-pr-${prNumber}[-.]`);
              const prAliases = (aliasData.aliases || []).filter(a => ownAlias.test(a.alias));
              for (const a of prAliases) {
                console.log(`Deleting alias ${a.alias} (id: ${a.uid})...`);
                await fetch(`https://api.vercel.com/v2/aliases/${a.uid}?teamId=${teamId}`, {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${token}` },
                });
              }
            } catch (err) {
              console.warn('Error deleting aliases:', err.message);
            }

            // 2. Delete preview deployments tagged with this PR.
            // Never match by branch name: a PR from a fork's `main` would
            // then match every production deployment built from `main`.
            // Production deployments are never deleted here.
            try {
              const depRes = await fetch(`https://api.vercel.com/v6/deployments?projectId=${projectId}&teamId=${teamId}&limit=100`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const depData = await depRes.json();
              const prDeployments = (depData.deployments || []).filter(d => {
                if (d.target === 'production') return false;
                const metaPr = String(d.meta?.prId || d.meta?.githubPrId || '');
                return metaPr === prNumber;
              });

              console.log(`Found ${prDeployments.length} deployments for PR #${prNumber}`);
              for (const dep of prDeployments) {
                console.log(`Deleting deployment ${dep.uid} (${dep.url})...`);
                await fetch(`https://api.vercel.com/v13/deployments/${dep.uid}?teamId=${teamId}`, {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${token}` },
                });
              }
            } catch (err) {
              console.warn('Error deleting deployments:', err.message);
            }

      - name: Update PR Comment to Decommissioned
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const isMerged = context.payload.pull_request.merged;
            const marker = '<!-- vercel-preview-deployment -->';

            const commentBody = `${marker}
            ### 🛑 Vercel Preview Decommissioned

            | Name | Status | PR Event |
            | :--- | :--- | :--- |
            | **Labyrinth 3D Site** | 🗑️ Killed (Offline) | ${isMerged ? 'Merged into `main`' : 'Pull request closed'} |

            * The preview deployment and its alias have been permanently removed from Vercel.
            * The temporary preview URL is now offline (returns 404).`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const botComment = comments.find(comment => comment.body.includes(marker));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody,
                });
              }
            } catch (err) {
              console.warn('Could not update PR comment:', err.message);
            }
