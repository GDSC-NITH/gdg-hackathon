  <rect x="3" y="18" width="8" height="1" fill="#38200d"/>
  <rect x="12" y="18" width="8" height="1" fill="#38200d"/>

  <!-- Parchment Pages Left -->
  <rect x="3" y="10" width="8" height="8" fill="#ede5d2"/>
