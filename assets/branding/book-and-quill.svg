<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- Feather Quill -->
  <rect x="17" y="1" width="2" height="2" fill="#302d38"/>
  <rect x="16" y="2" width="2" height="2" fill="#585466"/>
  <rect x="18" y="2" width="1" height="2" fill="#25232c"/>
  <rect x="15" y="3" width="2" height="2" fill="#938fa6"/>
  <rect x="17" y="3" width="1" height="3" fill="#302d38"/>
  <rect x="14" y="4" width="2" height="2" fill="#585466"/>
  <rect x="16" y="4" width="1" height="2" fill="#938fa6"/>
  <rect x="13" y="5" width="2" height="2" fill="#302d38"/>
  <rect x="15" y="5" width="1" height="2" fill="#585466"/>
  <rect x="12" y="6" width="2" height="2" fill="#25232c"/>
