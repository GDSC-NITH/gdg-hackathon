  <rect x="3" y="10" width="1" height="8" fill="#d9ceb6"/>
  <rect x="3" y="17" width="8" height="1" fill="#c4b89e"/>
  <!-- Writing lines left page -->
  <rect x="5" y="12" width="4" height="1" fill="#4d4436"/>
