<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Minecraft Furnace (Lit): 16x16 pixel art -->
  <!-- Outer stone border -->
  <rect x="0" y="0" width="16" height="16" fill="#374151"/>
  <rect x="1" y="1" width="14" height="14" fill="#6b7280"/>
  <!-- Cobblestone speckles -->
  <rect x="2" y="2" width="2" height="2" fill="#4b5563"/>
  <rect x="12" y="2" width="2" height="2" fill="#9ca3af"/>
  <rect x="2" y="12" width="2" height="2" fill="#9ca3af"/>
  <rect x="12" y="12" width="2" height="2" fill="#4b5563"/>
  <rect x="5" y="1" width="6" height="2" fill="#4b5563"/>
  <!-- Fire chamber opening -->
  <rect x="4" y="6" width="8" height="7" fill="#1f2937"/>
  <!-- Fire glow inside -->
  <rect x="5" y="7" width="6" height="5" fill="#ea580c"/>
  <rect x="5" y="8" width="6" height="4" fill="#f97316"/>
  <rect x="6" y="9" width="4" height="3" fill="#facc15"/>
  <rect x="7" y="10" width="2" height="2" fill="#fef08a"/>
</svg>
