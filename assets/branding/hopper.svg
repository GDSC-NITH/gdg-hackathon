<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Minecraft Hopper: 16x16 pixel art -->
  <!-- Top wide funnel rim -->
  <rect x="1" y="2" width="14" height="4" fill="#374151"/>
  <rect x="2" y="3" width="12" height="2" fill="#1f2937"/>
  <!-- Middle tapered neck -->
  <rect x="3" y="6" width="10" height="3" fill="#4b5563"/>
  <rect x="5" y="9" width="6" height="4" fill="#374151"/>
  <rect x="6" y="9" width="4" height="4" fill="#1f2937"/>
  <!-- Bottom spout -->
  <rect x="6" y="13" width="4" height="2" fill="#4b5563"/>
  <!-- Highlights -->
  <rect x="1" y="2" width="14" height="1" fill="#6b7280"/>
  <rect x="3" y="6" width="10" height="1" fill="#6b7280"/>
</svg>
