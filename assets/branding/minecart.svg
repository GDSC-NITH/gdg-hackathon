<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 20" shape-rendering="crispEdges">
  <!-- Minecraft Minecart: 24x20 pixel art -->
  <!-- Steam / Smoke puff on left -->
  <rect x="0" y="4" width="2" height="2" fill="#d1d5db" opacity="0.4"/>
  <rect x="2" y="3" width="3" height="3" fill="#e5e7eb" opacity="0.6"/>
  <rect x="1" y="6" width="2" height="2" fill="#9ca3af" opacity="0.5"/>
  <!-- Top lip / rim -->
  <rect x="5" y="5" width="16" height="2" fill="#d1d5db"/>
  <rect x="5" y="5" width="16" height="1" fill="#f3f4f6"/>
  <!-- Cart body interior -->
  <rect x="7" y="7" width="12" height="4" fill="#374151"/>
  <!-- Cart outer walls -->
  <rect x="5" y="7" width="2" height="6" fill="#9ca3af"/>
  <rect x="19" y="7" width="2" height="6" fill="#6b7280"/>
  <rect x="7" y="11" width="12" height="2" fill="#4b5563"/>
  <rect x="6" y="9" width="14" height="4" fill="#6b7280"/>
  <rect x="6" y="12" width="14" height="2" fill="#4b5563"/>
  <!-- Bottom base -->
  <rect x="7" y="14" width="12" height="1" fill="#374151"/>
  <!-- Wheels / undercarriage -->
  <rect x="7" y="15" width="3" height="3" fill="#1f2937"/>
  <rect x="8" y="16" width="1" height="1" fill="#9ca3af"/>
  <rect x="16" y="15" width="3" height="3" fill="#1f2937"/>
  <rect x="17" y="16" width="1" height="1" fill="#9ca3af"/>
  <!-- Shadow on rail -->
  <rect x="6" y="18" width="14" height="1" fill="#111827" opacity="0.4"/>
</svg>
