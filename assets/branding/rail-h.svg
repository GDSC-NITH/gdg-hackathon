<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Horizontal Minecraft Rail: 2 wood sleepers and 2 iron rails -->
  <!-- Wood sleeper 1 -->
  <rect x="2" y="2" width="12" height="3" fill="#784c28"/>
  <rect x="2" y="2" width="12" height="1" fill="#9c663b"/>
  <rect x="2" y="4" width="12" height="1" fill="#4d2e16"/>
  <!-- Wood sleeper 2 -->
  <rect x="2" y="10" width="12" height="3" fill="#784c28"/>
  <rect x="2" y="10" width="12" height="1" fill="#9c663b"/>
  <rect x="2" y="12" width="12" height="1" fill="#4d2e16"/>
  <!-- Top iron rail -->
  <rect x="0" y="5" width="16" height="2" fill="#9ca3af"/>
  <rect x="0" y="5" width="16" height="1" fill="#e5e7eb"/>
  <rect x="0" y="6" width="16" height="1" fill="#4b5563"/>
  <!-- Bottom iron rail -->
  <rect x="0" y="9" width="16" height="2" fill="#9ca3af"/>
  <rect x="0" y="9" width="16" height="1" fill="#e5e7eb"/>
  <rect x="0" y="10" width="16" height="1" fill="#4b5563"/>
  <!-- Rail ties / spikes -->
  <rect x="4" y="4" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="4" width="1" height="1" fill="#1f2937"/>
  <rect x="4" y="11" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="11" width="1" height="1" fill="#1f2937"/>
</svg>
