<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Lit Redstone Lamp: warm glowing amber face with dark wood cross braces -->
  <!-- Outer border -->
  <rect x="0" y="0" width="16" height="16" fill="#451a03"/>
  <!-- Glowing amber face -->
  <rect x="1" y="1" width="14" height="14" fill="#d97706"/>
  <rect x="2" y="2" width="12" height="12" fill="#f59e0b"/>
  <rect x="3" y="3" width="10" height="10" fill="#fbbf24"/>
  <!-- Wood cross braces -->
  <rect x="7" y="1" width="2" height="14" fill="#78350f"/>
  <rect x="1" y="7" width="14" height="2" fill="#78350f"/>
  <!-- Center hub -->
  <rect x="6" y="6" width="4" height="4" fill="#451a03"/>
  <rect x="7" y="7" width="2" height="2" fill="#fbbf24"/>
  <!-- Corner braces -->
  <rect x="1" y="1" width="2" height="2" fill="#451a03"/>
  <rect x="13" y="1" width="2" height="2" fill="#451a03"/>
  <rect x="1" y="13" width="2" height="2" fill="#451a03"/>
  <rect x="13" y="13" width="2" height="2" fill="#451a03"/>
</svg>
