<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <!-- Outer mortar border -->
  <rect width="96" height="96" fill="#201d19"/>
  
  <!-- Base brick tone: #7e7970 -->
  <rect x="2" y="2" width="92" height="20" fill="#7e7970"/>
  <rect x="2" y="74" width="92" height="20" fill="#7e7970"/>
  <rect x="2" y="22" width="20" height="52" fill="#78736a"/>
  <rect x="74" y="22" width="20" height="52" fill="#78736a"/>
  
  <!-- Top edge: 2 bricks (mortar joint at x=46..48) -->
  <rect x="2" y="2" width="44" height="2" fill="#b9b4a9"/>
  <rect x="48" y="2" width="46" height="2" fill="#b9b4a9"/>
  <rect x="2" y="20" width="44" height="2" fill="#464239"/>
  <rect x="48" y="20" width="46" height="2" fill="#464239"/>
  <rect x="44" y="2" width="2" height="20" fill="#464239"/>
  <rect x="46" y="2" width="2" height="20" fill="#201d19"/>
  <rect x="48" y="2" width="2" height="20" fill="#b9b4a9"/>
  <!-- Top stone noise -->
  <rect x="12" y="8" width="4" height="2" fill="#908a7f"/>
  <rect x="28" y="14" width="6" height="2" fill="#676259"/>
  <rect x="62" y="6" width="5" height="2" fill="#908a7f"/>
  <rect x="78" y="12" width="4" height="2" fill="#676259"/>

  <!-- Bottom edge: 2 bricks (mortar joint at x=46..48) -->
  <rect x="2" y="74" width="44" height="2" fill="#b9b4a9"/>
  <rect x="48" y="74" width="46" height="2" fill="#b9b4a9"/>
  <rect x="2" y="92" width="44" height="2" fill="#464239"/>
  <rect x="48" y="92" width="46" height="2" fill="#464239"/>
  <rect x="44" y="74" width="2" height="20" fill="#464239"/>
  <rect x="46" y="74" width="2" height="20" fill="#201d19"/>
  <rect x="48" y="74" width="2" height="20" fill="#b9b4a9"/>
  <!-- Bottom stone noise -->
  <rect x="16" y="82" width="5" height="2" fill="#676259"/>
  <rect x="34" y="86" width="6" height="2" fill="#908a7f"/>
  <rect x="68" y="80" width="4" height="2" fill="#908a7f"/>
  <rect x="82" y="86" width="5" height="2" fill="#676259"/>

  <!-- Left edge: mortar joint at y=46..48 -->
  <rect x="2" y="2" width="2" height="92" fill="#b9b4a9"/>
  <rect x="20" y="24" width="2" height="22" fill="#464239"/>
  <rect x="20" y="48" width="2" height="26" fill="#464239"/>
  <rect x="2" y="44" width="20" height="2" fill="#464239"/>
  <rect x="2" y="46" width="20" height="2" fill="#201d19"/>
  <rect x="2" y="48" width="20" height="2" fill="#b9b4a9"/>
  <!-- Left stone noise -->
  <rect x="6" y="32" width="2" height="5" fill="#908a7f"/>
  <rect x="14" y="58" width="2" height="4" fill="#676259"/>

  <!-- Right edge: mortar joint at y=46..48 -->
  <rect x="74" y="24" width="2" height="22" fill="#b9b4a9"/>
  <rect x="74" y="48" width="2" height="26" fill="#b9b4a9"/>
  <rect x="92" y="2" width="2" height="92" fill="#464239"/>
  <rect x="74" y="44" width="20" height="2" fill="#464239"/>
  <rect x="74" y="46" width="20" height="2" fill="#201d19"/>
  <rect x="74" y="48" width="20" height="2" fill="#b9b4a9"/>
  <!-- Right stone noise -->
  <rect x="80" y="36" width="2" height="4" fill="#676259"/>
  <rect x="86" y="62" width="2" height="5" fill="#908a7f"/>

  <!-- Inner mortar border (x:22..74, y:22..74) -->
  <rect x="22" y="22" width="52" height="2" fill="#201d19"/>
  <rect x="22" y="72" width="52" height="2" fill="#201d19"/>
  <rect x="22" y="22" width="2" height="52" fill="#201d19"/>
  <rect x="72" y="22" width="2" height="52" fill="#201d19"/>

  <!-- Center transparent cut -->
  <rect x="24" y="24" width="48" height="48" fill="transparent"/>
</svg>